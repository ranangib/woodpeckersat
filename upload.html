<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upload SAT questions and earn money for your contributions.">
    <title>Upload SAT Questions | woodpeckersat.online</title>
    <style>
        :root { --ink: #172b27; --muted: #52645f; --paper: #f4f7f2; --forest: #17483e; --coral: #e47755; --line: #d8e1da; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 0 20px; color: var(--ink); background: var(--paper); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
        .page { width: min(100%, 860px); min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
        header { padding: 26px 0; border-bottom: 1px solid var(--line); }
        header a { color: var(--forest); font-size: 1rem; font-weight: 800; text-decoration: none; }
        main { margin: auto 0; padding: 72px 0; }
        .eyebrow { margin: 0 0 18px; color: #a44a31; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
        h1 { max-width: 700px; margin: 0; color: var(--forest); font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.5rem, 8vw, 4.8rem); font-weight: 500; line-height: 1.02; }
        .description { max-width: 620px; margin: 24px 0 32px; color: var(--muted); font-size: 1.12rem; line-height: 1.7; }
        .back-link { min-height: 50px; display: inline-flex; align-items: center; padding: 0 18px; border: 1px solid var(--forest); border-radius: 5px; color: white; background: var(--forest); font-weight: 700; text-decoration: none; }
        .back-link:hover { background: #236456; }
        .back-link:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
        footer { padding: 18px 0 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="page">
        <header><a href="index.html">woodpeckersat.online</a></header>
        <main>
            <p class="eyebrow">Share what you know</p>
            <h1>Earn money by uploading SAT questions.</h1>
            <p class="description">Have a knack for writing great SAT questions? This is a way to earn money by contributing your original SAT questions to woodpeckersat.online.</p>
            <a class="back-link" href="index.html">Back to home</a>
        </main>
        <footer>woodpeckersat.online</footer>
    </div>
</body>
</html>
