<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Prep App</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-bg: #f0fdf4;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .dashboard-container {
            max-width: 850px;
            margin: 40px auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            background: #1e293b;
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .progress-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .quiz-body {
            padding: 32px;
        }

        .question-meta {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 24px;
            white-space: pre-wrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
        }

        .option-card:hover:not(.disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: #e2e8f0;
            border-radius: 6px;
            margin-right: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #475569;
            flex-shrink: 0;
        }

        .option-card.correct-pick {
            background: var(--success-bg);
            border-color: var(--success);
            color: #065f46;
        }

        .option-card.correct-pick .option-letter {
            background: var(--success);
            color: white;
        }

        .option-card.incorrect-pick {
            background: var(--error-bg);
            border-color: var(--error);
            color: #991b1b;
        }

        .option-card.incorrect-pick .option-letter {
            background: var(--error);
            color: white;
        }

        .option-card.reveal-correct {
            background: var(--success-bg);
            border-color: var(--success);
        }

        .option-card.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .explanation-panel {
            margin-top: 24px;
            padding: 24px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease-out;
            border-left: 5px solid;
        }

        .explanation-panel.correct-style {
            background: var(--success-bg);
            border-color: var(--success);
            color: #065f46;
        }

        .explanation-panel.incorrect-style {
            background: var(--error-bg);
            border-color: var(--error);
            color: #991b1b;
        }

        .exp-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exp-desc {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
            min-height: 48px;
        }

        .next-btn {
            display: none;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="header">
            <h1 id="quiz-title">Digital SAT Practice Engine</h1>
            <div class="progress-badge" id="progress-text">Loading Data...</div>
        </div>
        <div class="quiz-body">
            <div class="question-meta" id="question-tag">...</div>
            <div class="question-text" id="question-box">Initializing questions directly from data source file...</div>

            <div class="options-list" id="options-box"></div>

            <div class="explanation-panel" id="explanation-box">
                <div class="exp-title" id="exp-headline">Explanation</div>
                <div class="exp-desc" id="exp-body"></div>
            </div>

            <div class="action-container">
                <button class="next-btn" id="next-button" onclick="handleNextClick()">Next Question →</button>
            </div>
        </div>
    </div>
    <!-- If your dashboard is on index.html or your root domain -->
    <a href="/">
        <button type="button" class="back-btn">🏠 Back to Dashboard</button>
    </a>

    <script>
        let testItems = [];
        let currentQuestionIdx = 0;
        let optionSelectionLocked = false;

        // Asynchronously call and parse external JSON asset configurations
        async function initializeQuizApp() {
            try {
                const response = await fetch('quiz_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                testItems = await response.json();
                loadEngineQuestion();
            } catch (error) {
                console.error("Could not fetch quiz data:", error);
                document.getElementById("question-box").innerText = "Failed to load questions from quiz_data.json. Make sure both files are in the same folder on a live server environment.";
            }
        }

        function loadEngineQuestion() {
            if (testItems.length === 0) return;

            optionSelectionLocked = false;
            const currentData = testItems[currentQuestionIdx];

            document.getElementById("progress-text").innerText = `Question ${currentQuestionIdx + 1} of ${testItems.length}`;
            document.getElementById("question-tag").innerText = currentData.tag;
            document.getElementById("question-box").innerText = currentData.question;

            const explanationBox = document.getElementById("explanation-box");
            explanationBox.style.display = "none";
            explanationBox.className = "explanation-panel";
            document.getElementById("next-button").style.display = "none";

            const optionsContainer = document.getElementById("options-box");
            optionsContainer.innerHTML = "";

            const letterArray = ["A", "B", "C", "D"];
            currentData.options.forEach((optionText, idx) => {
                const buttonElement = document.createElement("button");
                buttonElement.className = "option-card";

                const letterSpan = document.createElement("span");
                letterSpan.className = "option-letter";
                letterSpan.innerText = letterArray[idx];

                const textSpan = document.createElement("span");
                textSpan.innerText = optionText;

                buttonElement.appendChild(letterSpan);
                buttonElement.appendChild(textSpan);

                buttonElement.onclick = () => validateSelection(idx, buttonElement);
                optionsContainer.appendChild(buttonElement);
            });
        }

        function validateSelection(selectedIndex, clickedButton) {
            if (optionSelectionLocked) return;
            optionSelectionLocked = true;

            const questionData = testItems[currentQuestionIdx];
            const allOptionCards = document.getElementsByClassName("option-card");

            for (let card of allOptionCards) {
                card.classList.add("disabled");
            }

            const isCorrectChoice = (selectedIndex === questionData.answerIndex);

            if (isCorrectChoice) {
                clickedButton.classList.add("correct-pick");
                triggerExplanationView(true, "Correct! Excellent choice.", questionData.explanationText);
            } else {
                clickedButton.classList.add("incorrect-pick");
                allOptionCards[questionData.answerIndex].classList.add("reveal-correct");
                triggerExplanationView(false, "Incorrect", questionData.explanationText);
            }

            document.getElementById("next-button").style.display = "block";
        }

        function triggerExplanationView(isCorrect, statusHeadline, explanationBody) {
            const panel = document.getElementById("explanation-box");
            const title = document.getElementById("exp-headline");
            const body = document.getElementById("exp-body");

            panel.style.display = "block";
            body.innerText = explanationBody;
            title.innerText = statusHeadline;

            if (isCorrect) {
                panel.classList.add("correct-style");
            } else {
                panel.classList.add("incorrect-style");
            }
        }

        function handleNextClick() {
            if (currentQuestionIdx < testItems.length - 1) {
                currentQuestionIdx++;
                loadEngineQuestion();
            } else {
                alert("Congratulations! You have completed all the grammar practice items.");
                currentQuestionIdx = 0;
                loadEngineQuestion();
            }
        }
        // Launch execution pipeline on page rendering complete
        window.onload = initializeQuizApp;
    </script>
</body>
